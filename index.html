    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
            background: #fafafa;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #111;
        }

        .container {
            max-width: 480px;
            width: 100%;
            padding: 60px 40px;
            text-align: center;
        }

        .profile-image {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto 32px;
            display: block;
            border: 1px solid rgba(0, 0, 0, 0.06);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .profile-image:hover {
            transform: scale(1.02);
            border-color: rgba(0, 0, 0, 0.12);
        }

        h1 {
            font-size: 2rem;
            color: #111;
            margin-bottom: 8px;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .subtitle {
            font-size: 1rem;
            color: #666;
            margin-bottom: 40px;
            font-weight: 400;
            line-height: 1.6;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .social-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #fff;
            border: 1px solid rgba(0, 0, 0, 0.08);
            color: #111;
            text-decoration: none;
            transition: all 0.15s ease;
        }

        .social-link:hover {
            background: #111;
            border-color: #111;
            transform: translateY(-2px);
        }

        .social-link:hover svg {
            fill: #fff;
        }

        .social-link svg {
            width: 20px;
            height: 20px;
            fill: #111;
            transition: fill 0.15s ease;
        }

        @media (max-width: 480px) {
            .container {
                padding: 50px 30px;
            }

            h1 {
                font-size: 1.75rem;
            }

            .subtitle {
                font-size: 0.95rem;
            }

            .profile-image {
                width: 100px;
                height: 100px;
                margin-bottom: 28px;
            }

            .social-link {
                width: 42px;
                height: 42px;
            }

            .social-link svg {
                width: 18px;
                height: 18px;
            }
        }

        @media (prefers-color-scheme: dark) {
            body {
                background: #111;
                color: #fff;
            }

            h1 {
                color: #fff;
            }

            .subtitle {
                color: #999;
            }

            .profile-image {
                border-color: rgba(255, 255, 255, 0.1);
            }

            .profile-image:hover {
                border-color: rgba(255, 255, 255, 0.2);
            }

            .social-link {
                background: #1a1a1a;
                border-color: rgba(255, 255, 255, 0.1);
            }

            .social-link svg {
                fill: #fff;
            }

            .social-link:hover {
                background: #fff;
                border-color: #fff;
            }

            .social-link:hover svg {
                fill: #111;
            }
        }
    </style>
</head>
